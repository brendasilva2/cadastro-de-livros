<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo dos livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="cabecalho">
            <img class = "capa" src = "assets/capa.png" alt="Imagem de capa do site">
            <h1 class="titulo-principal">Universo dos livros</h1>
        </header>

        <section class="catalogo-livros">
            <input type="radio" name="aba" id="aba-catalogo" checked>
            <input type="radio" name="aba" id="aba-formulario">

            <div class="abas">
                <label class="aba" for="aba-catalogo">Catálogo</label>
                <label class="aba" for="aba-formulario">Cadastrar Livro</label>
            </div>

            <div id="catalogo" class="catalogo">
                

            </div>

            <div id="formulario" class="cadastro">   
                <form class="formulario">

                    <div class="titulo-livro">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" required>
                    </div>

                    <div class="autor-livro">
                        <label for="autor">Autor</label>
                        <input type="text" id="autor" required>
                    </div>

                    <div class="genero-livro">
                        <label for="genero">Gênero</label>
                        <input type="text" id="genero" required>
                    </div>

                    <div class="data-publicacao">
                        <label for="data">Data de publicação:</label>
                        <input type="date" id="data" required>
                    </div>

                    <div class="carregar-capa">
                        <label for="capa">Capa do livro</label>
                        <input type="file" id="capa">
                    </div>

                    <div class="escrever-resumo">
                        <label for="resumo">Resumo</label>
                        <textarea id="resumo" rows="6" required></textarea>
                    </div>

                    <button type="submit" class="btn-salvar">Salvar</button>
                    <button type="button" class="btn-cancelar">Cancelar</button>
                </form>
            </div> 
        </section>

    <footer class="rodape">
        <p class="direitos">© 2026 Universo dos Livros — Todos os direitos reservados. <br>
        Imagens retiradas do Google e utilizadas somente para fins acadêmicos</p>
    </footer>
            
           
        </section>
    </div>

    <script src="script.js"></script>  

</body>
</html>
